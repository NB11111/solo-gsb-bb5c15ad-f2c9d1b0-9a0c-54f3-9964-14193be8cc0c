services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seal
      POSTGRES_PASSWORD: seal
      POSTGRES_DB: sealed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seal -d sealed"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://seal:seal@db:5432/sealed
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
